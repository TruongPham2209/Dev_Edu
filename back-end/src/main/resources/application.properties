spring.application.name=back-end
server.port=${SERVER_PORT:9000}

#datasource
spring.datasource.url=${POSTGRES_HOST}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000



#jpa
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate


# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


#redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=2000ms


#logging
logging.level.org.tdtu.ttit=DEBUG
logging.level.org.springframework.grpc=DEBUG
logging.level.io.grpc=INFO
logging.level.org.springframework.web=DEBUG


# Actuator
management.endpoints.web.exposure.include=health,info,metrics,trace
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0


# Kafka Config
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.consumer.properties.heartbeat.interval.ms=20000
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=1

# Kafka listener config
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3


# Cloudflare R2 Config
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.public-bucket-name=${CLOUDFLARE_R2_PUBLIC_BUCKET_NAME}
cloudflare.r2.private-bucket-name=${CLOUDFLARE_R2_PRIVATE_BUCKET_NAME}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL}


# Brevo Config
brevo.api.key=${BREVO_API_KEY}
brevo.from-mail=${BREVO_MAIL}
brevo.from-name=${BREVO_NAME}